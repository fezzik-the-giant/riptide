name: CI

# Not `push` on every branch: with a PR open, each push would run twice over
# the same tree. PRs cover branches; master is built on push so every commit a
# tag can land on has had its flake built (#62).
on:
  push:
    branches: [master]
  pull_request:

# Never cancel on master: each commit there must keep its own green build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No system dependencies or cache: `cargo fmt` parses the source without
      # building it, so nothing here needs to link against libssl/dbus.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      # COPR builds the spec as committed in git rather than the tag payload, so
      # a spec left behind by a release ships the wrong version. Keeping this in
      # step is what lets the sync happen at staging time instead of mid-release.
      - name: Check riptide.spec is in sync
        run: |
          set -euo pipefail
          CARGO_VER=$(sed -n '0,/^version = /s/^version = "\(.*\)"/\1/p' Cargo.toml)
          SPEC_VER=$(sed -n 's/^Version:[[:space:]]*//p' riptide.spec)
          if [ "$CARGO_VER" != "$SPEC_VER" ]; then
            echo "::error::riptide.spec is $SPEC_VER but Cargo.toml is $CARGO_VER — run ./scripts/sync-spec.sh"
            exit 1
          fi
          if ! grep -q "^\* .* - ${CARGO_VER}-" riptide.spec; then
            echo "::error::riptide.spec has no changelog entry for $CARGO_VER — run ./scripts/sync-spec.sh"
            exit 1
          fi
          echo "riptide.spec is in sync at $CARGO_VER."

  nix:
    name: Nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Building the dependency tree is ~90% of this job, and it only changes
      # with the lockfiles. The flake's filtered source makes Nix's own hash
      # the judge of whether riptide needs rebuilding, so a docs-only commit
      # costs nothing past the restore. Only master saves: a PR's cache is
      # scoped to that PR, and the repo's 10 GB limit would evict master's.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: ${{ github.ref == 'refs/heads/master' }}
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # The flake filters its own source, so it can break while `cargo build`
      # stays green: v1.5.0 shipped unbuildable on Nix because the filter
      # dropped the cover art that `src/app/mod.rs` embeds, and nothing here
      # ever built it to notice (#60).
      - name: Build the flake
        run: nix build .#riptide --print-build-logs

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        uses: ./.github/actions/system-deps

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test
