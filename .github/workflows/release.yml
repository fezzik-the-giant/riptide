name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No system dependencies or cache: `cargo fmt` parses the source without
      # building it, so nothing here needs to link against libssl/dbus.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      # COPR builds the spec as committed in git rather than the tag payload, so
      # a spec left behind by a release ships the wrong version. Keeping this in
      # step is what lets the sync happen at staging time instead of mid-release.
      - name: Check riptide.spec is in sync
        run: |
          set -euo pipefail
          CARGO_VER=$(sed -n '0,/^version = /s/^version = "\(.*\)"/\1/p' Cargo.toml)
          SPEC_VER=$(sed -n 's/^Version:[[:space:]]*//p' riptide.spec)
          if [ "$CARGO_VER" != "$SPEC_VER" ]; then
            echo "::error::riptide.spec is $SPEC_VER but Cargo.toml is $CARGO_VER — run ./scripts/sync-spec.sh"
            exit 1
          fi
          if ! grep -q "^\* .* - ${CARGO_VER}-" riptide.spec; then
            echo "::error::riptide.spec has no changelog entry for $CARGO_VER — run ./scripts/sync-spec.sh"
            exit 1
          fi
          echo "riptide.spec is in sync at $CARGO_VER."

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        uses: ./.github/actions/system-deps

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Run tests
        run: cargo test

  build-linux:
    needs: [test, lint]
    name: Build x86_64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        uses: ./.github/actions/system-deps

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Create archive
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar -czf ../../../riptide-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz riptide
          cd ../../../
          sha256sum riptide-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz > riptide-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: riptide-${{ github.ref_name }}-x86_64-linux-gnu
          path: |
            riptide-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz
            riptide-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz.sha256

  # Both macOS targets build natively. ratatui-image's default `chafa-dyn`
  # feature links the system libchafa through pkg-config, so cross-compiling
  # x86_64 from an Apple Silicon runner cannot work: the pkg-config crate
  # refuses to run when cross-compiling, and Homebrew there supplies an arm64
  # dylib that will not link into an x86_64 binary.
  build-macos-intel:
    needs: [test, lint]
    name: Build x86_64-macos
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: brew install chafa

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-intel

      - name: Build release
        run: cargo build --release

      - name: Create archive
        run: |
          cd target/release
          tar -czf ../../riptide-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz riptide
          cd ../../
          sha256sum riptide-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz > riptide-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: riptide-${{ github.ref_name }}-x86_64-apple-darwin
          path: |
            riptide-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz
            riptide-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz.sha256

  build-macos-arm:
    needs: [test, lint]
    name: Build aarch64-macos (native ARM)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: brew install chafa

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-arm

      - name: Build release
        run: cargo build --release

      - name: Create archive
        run: |
          cd target/release
          tar -czf ../../riptide-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz riptide
          cd ../../
          sha256sum riptide-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz > riptide-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: riptide-${{ github.ref_name }}-aarch64-apple-darwin
          path: |
            riptide-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            riptide-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz.sha256

  create-release:
    name: Create Release
    needs: [build-linux, build-macos-intel, build-macos-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Extract the section for this version
          awk "/## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release_notes.txt

          # If release notes are empty, it means version wasn't found in CHANGELOG
          if [ ! -s release_notes.txt ]; then
            echo "⚠️ Version ${VERSION} not found in CHANGELOG.md" > release_notes.txt
            echo "Please update CHANGELOG.md with release notes for this version." >> release_notes.txt
          fi

          cat release_notes.txt

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release-files/ \;
          ls -lah release-files/

      - name: Create checksums file
        run: |
          cd release-files
          cat *.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          body_path: release_notes.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # COPR builds the committish configured in the project's SCM settings, not
  # whatever this webhook says — the request carries no ref. Point that setting
  # at the default branch: the release commit that bumps riptide.spec is on it
  # and is what gets tagged, so the version COPR builds matches the tag.
  #
  # The project also needs "Enable internet access during builds" (Settings →
  # Build options), because the spec builds with plain cargo against crates.io.
  copr-build:
    name: Build RPM on COPR
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger COPR build (scm webhook)
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          # A secret pasted into GitHub commonly keeps a trailing newline, and curl
          # rejects that as "Malformed input to a URL function" without naming the
          # newline or the variable. Strip whitespace before using it. Never echo
          # the result: masking matches the secret verbatim, so a trimmed copy
          # would print in the clear.
          url="$(printf '%s' "${COPR_WEBHOOK_URL:-}" | tr -d '[:space:]')"
          if [ -z "$url" ]; then
            echo "::notice::COPR_WEBHOOK_URL is not set — skipping the COPR build."
            echo "Add it under Settings → Secrets → Actions, copying the 'Webhook URL'"
            echo "from the COPR project's Settings → Integrations."
            exit 0
          fi
          case "$url" in
            https://*) ;;
            *)
              echo "::error::COPR_WEBHOOK_URL is not an https:// URL (${#url} characters after trimming)."
              echo "Copy the full 'Webhook URL' from the COPR project's Settings → Integrations."
              exit 1
              ;;
          esac

          status=0
          HTTP_CODE=$(curl -sS -o /tmp/copr_resp.txt -w "%{http_code}" -X POST "$url") || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::curl exited $status posting to the COPR webhook."
            exit "$status"
          fi
          cat /tmp/copr_resp.txt
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::COPR webhook returned HTTP $HTTP_CODE"
            exit 1
          fi

  aur-update:
    name: Update AUR
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download tarball and compute sha256sum
        id: sha256
        run: |
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          echo "SHA256=$SHA" >> $GITHUB_OUTPUT

      - name: Set up SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat >> ~/.ssh/config << EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
            StrictHostKeyChecking no
          EOF

      - name: Clone AUR repo
        run: git clone ssh://aur@aur.archlinux.org/riptide.git aur-riptide

      - name: Update PKGBUILD
        run: |
          cd aur-riptide
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.VERSION }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/sha256sums=('.*')/sha256sums=('${{ steps.sha256.outputs.SHA256 }}')/" PKGBUILD
          sed -i "s|riptide-[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz|riptide-${{ steps.version.outputs.VERSION }}.tar.gz|g" PKGBUILD
          sed -i "s|/tags/v[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz|/tags/v${{ steps.version.outputs.VERSION }}.tar.gz|g" PKGBUILD

      - name: Update .SRCINFO
        run: |
          cd aur-riptide
          sed -i "s/pkgver = .*/pkgver = ${{ steps.version.outputs.VERSION }}/" .SRCINFO
          sed -i "s/pkgrel = .*/pkgrel = 1/" .SRCINFO
          sed -i "s/sha256sums = .*/sha256sums = ${{ steps.sha256.outputs.SHA256 }}/" .SRCINFO
          # Update source URL version
          sed -i "s|riptide-[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz|riptide-${{ steps.version.outputs.VERSION }}.tar.gz|g" .SRCINFO
          sed -i "s|/tags/v[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz|/tags/v${{ steps.version.outputs.VERSION }}.tar.gz|g" .SRCINFO

      - name: Commit and push to AUR
        run: |
          cd aur-riptide
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add PKGBUILD .SRCINFO
          git diff --staged --quiet || git commit -m "update to ${{ github.ref_name }}"
          git push
