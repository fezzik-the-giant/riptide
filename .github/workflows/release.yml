name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No system dependencies or cache: `cargo fmt` parses the source without
      # building it, so nothing here needs to link against libssl/dbus.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libglib2.0-dev libchafa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Run tests
        run: cargo test

  build-linux:
    needs: [test, lint]
    name: Build x86_64-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libglib2.0-dev libchafa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Create archive
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar -czf ../../../riptide-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz riptide
          cd ../../../
          sha256sum riptide-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz > riptide-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: riptide-${{ github.ref_name }}-x86_64-linux-gnu
          path: |
            riptide-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz
            riptide-${{ github.ref_name }}-x86_64-linux-gnu.tar.gz.sha256

  # Both macOS targets build natively. ratatui-image's default `chafa-dyn`
  # feature links the system libchafa through pkg-config, so cross-compiling
  # x86_64 from an Apple Silicon runner cannot work: the pkg-config crate
  # refuses to run when cross-compiling, and Homebrew there supplies an arm64
  # dylib that will not link into an x86_64 binary.
  build-macos-intel:
    needs: [test, lint]
    name: Build x86_64-macos
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: brew install chafa

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-intel

      - name: Build release
        run: cargo build --release

      - name: Create archive
        run: |
          cd target/release
          tar -czf ../../riptide-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz riptide
          cd ../../
          sha256sum riptide-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz > riptide-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: riptide-${{ github.ref_name }}-x86_64-apple-darwin
          path: |
            riptide-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz
            riptide-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz.sha256

  build-macos-arm:
    needs: [test, lint]
    name: Build aarch64-macos (native ARM)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: brew install chafa

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-arm

      - name: Build release
        run: cargo build --release

      - name: Create archive
        run: |
          cd target/release
          tar -czf ../../riptide-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz riptide
          cd ../../
          sha256sum riptide-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz > riptide-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: riptide-${{ github.ref_name }}-aarch64-apple-darwin
          path: |
            riptide-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            riptide-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz.sha256

  create-release:
    name: Create Release
    needs: [build-linux, build-macos-intel, build-macos-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Extract the section for this version
          awk "/## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release_notes.txt

          # If release notes are empty, it means version wasn't found in CHANGELOG
          if [ ! -s release_notes.txt ]; then
            echo "⚠️ Version ${VERSION} not found in CHANGELOG.md" > release_notes.txt
            echo "Please update CHANGELOG.md with release notes for this version." >> release_notes.txt
          fi

          cat release_notes.txt

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release-files/ \;
          ls -lah release-files/

      - name: Create checksums file
        run: |
          cd release-files
          cat *.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          body_path: release_notes.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  aur-update:
    name: Update AUR
    needs: create-release
    runs-on: ubuntu-latest
    continue-on-error: true    # Allowed to fail while AUR pushes are blocked
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download tarball and compute sha256sum
        id: sha256
        run: |
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          echo "SHA256=$SHA" >> $GITHUB_OUTPUT

      - name: Set up SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat >> ~/.ssh/config << EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
            StrictHostKeyChecking no
          EOF

      - name: Clone AUR repo
        run: git clone ssh://aur@aur.archlinux.org/riptide.git aur-riptide

      - name: Update PKGBUILD
        run: |
          cd aur-riptide
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.VERSION }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/sha256sums=('.*')/sha256sums=('${{ steps.sha256.outputs.SHA256 }}')/" PKGBUILD
          sed -i "s|riptide-[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz|riptide-${{ steps.version.outputs.VERSION }}.tar.gz|g" PKGBUILD
          sed -i "s|/tags/v[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz|/tags/v${{ steps.version.outputs.VERSION }}.tar.gz|g" PKGBUILD

      - name: Update .SRCINFO
        run: |
          cd aur-riptide
          sed -i "s/pkgver = .*/pkgver = ${{ steps.version.outputs.VERSION }}/" .SRCINFO
          sed -i "s/pkgrel = .*/pkgrel = 1/" .SRCINFO
          sed -i "s/sha256sums = .*/sha256sums = ${{ steps.sha256.outputs.SHA256 }}/" .SRCINFO
          # Update source URL version
          sed -i "s|riptide-[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz|riptide-${{ steps.version.outputs.VERSION }}.tar.gz|g" .SRCINFO
          sed -i "s|/tags/v[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz|/tags/v${{ steps.version.outputs.VERSION }}.tar.gz|g" .SRCINFO

      - name: Commit and push to AUR
        run: |
          cd aur-riptide
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add PKGBUILD .SRCINFO
          git diff --staged --quiet || git commit -m "update to ${{ github.ref_name }}"
          git push
